name: Deploy example deck

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync

      # -W turns warnings into errors: a deck that builds dirty is never published.
      - run: >
          uv run sphinx-build -b revealjs -W
          examples/slide-demo examples/slide-demo/_build/revealjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: examples/slide-demo/_build/revealjs

      - uses: actions/deploy-pages@v5
        id: deployment
